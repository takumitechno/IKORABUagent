    <path d="M400 149 q11 -5 22 1" stroke="#2a201c" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M362 166 q9 -6 18 0" stroke="#2a201c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M402 166 q9 -6 18 0" stroke="#2a201c" stroke-width="3" fill="none" stroke-linecap="round"/>
