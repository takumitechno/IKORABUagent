  <circle cx="320" cy="310" r="210" fill="none" stroke="#ffe08a" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.8"/>
  <circle cx="505" cy="150" r="18" fill="#f28c28"/>
  <circle cx="132" cy="210" r="9" fill="#ffe08a"/>

