      <rect x="168" y="388" width="134" height="88" rx="7" fill="url(#tablet)"/>
      <rect x="180" y="400" width="60" height="8" rx="4" fill="#0f7b6c"/>
      <rect x="180" y="418" width="104" height="6" rx="3" fill="#cfe3dc"/>
      <rect x="180" y="432" width="84" height="6" rx="3" fill="#cfe3dc"/>
      <rect x="180" y="450" width="40" height="14" rx="7" fill="#f28c28"/>
      <circle cx="276" cy="456" r="10" fill="#e3f3ec"/>
      <path d="M271 456 l4 4 l7 -8" stroke="#0f7b6c" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
