<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 70 500 490" width="500" height="490">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6dcc6"/>
      <stop offset="1" stop-color="#efcdb2"/>
    </linearGradient>
    <linearGradient id="skinShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b597"/>
      <stop offset="1" stop-color="#e9c2a5"/>
    </linearGradient>
    <linearGradient id="hairW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a24"/>
      <stop offset="1" stop-color="#1f1714"/>
    </linearGradient>
    <linearGradient id="hairM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2522"/>
      <stop offset="1" stop-color="#151110"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d4664"/>
      <stop offset="1" stop-color="#1d3047"/>
    </linearGradient>
    <linearGradient id="cardigan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e7d4"/>
      <stop offset="1" stop-color="#e5d3b8"/>
    </linearGradient>
    <linearGradient id="tablet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f3ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

