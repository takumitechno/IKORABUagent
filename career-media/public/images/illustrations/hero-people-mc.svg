    <!-- 手 -->
    <path d="M150 444 C150 426 162 418 176 420 C186 422 188 436 180 444 C172 454 156 458 150 444 Z" fill="url(#skin)"/>
    <path d="M300 404 C312 400 324 410 322 424 C320 438 306 442 298 434 C292 426 292 408 300 404 Z" fill="url(#skin)"/>
